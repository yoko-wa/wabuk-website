<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="품질, 사람에 대한 존중, 상생. 와벅이 한 끼를 준비하며 지키는 기준입니다.">
  <title>와벅의 철학 | WaBuk</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js" defer></script>

  <style>
    .philosophy-page {
      --philosophy-navy: #182942;
      --philosophy-cream: #fff3df;
      --philosophy-paper: #fffdfa;
      --philosophy-yellow: #f9bd43;
      --philosophy-line: #e8ded0;
      --philosophy-muted: #526076;
      background: var(--philosophy-paper);
      color: var(--philosophy-navy);
    }

    .philosophy-banner {
      padding-block: clamp(44px, 7vw, 84px);
      background: var(--philosophy-navy);
      color: var(--philosophy-cream);
    }

    .philosophy-banner h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 84px);
      line-height: 1.05;
      letter-spacing: -0.065em;
      word-break: keep-all;
    }

    .philosophy-banner h1::after {
      content: "";
      display: block;
      width: 54px;
      height: 5px;
      margin-top: 20px;
      border-radius: 999px;
      background: var(--philosophy-yellow);
    }

    .philosophy-banner p {
      margin: 18px 0 0;
      font-size: clamp(16px, 2vw, 20px);
      word-break: keep-all;
    }

    .philosophy-values {
      padding-block: clamp(36px, 7vw, 88px);
    }

    .philosophy-values h2 {
      margin: 0 0 24px;
      font-size: clamp(28px, 4.4vw, 48px);
      line-height: 1.18;
      letter-spacing: -0.055em;
      word-break: keep-all;
    }

    .philosophy-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 18px;
    }

    .philosophy-card {
      display: grid;
      align-content: center;
      gap: 12px;
      padding: clamp(22px, 4vw, 46px);
      border: 1px solid var(--philosophy-line);
      border-radius: 24px;
      background: #fff;
    }

    .philosophy-card--quality {
      grid-row: span 2;
      gap: 16px;
      background: var(--philosophy-cream);
    }

    .philosophy-card--quality::before {
      content: "";
      width: 38px;
      height: 5px;
      border-radius: 999px;
      background: var(--philosophy-yellow);
    }

    .philosophy-card h3 {
      margin: 0;
      font-size: clamp(22px, 2.8vw, 32px);
      line-height: 1.2;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }

    .philosophy-card--quality h3 {
      font-size: clamp(28px, 4.2vw, 51px);
    }

    .philosophy-card p {
      max-width: 36ch;
      margin: 0;
      color: var(--philosophy-muted);
      font-size: clamp(16px, 1.5vw, 18px);
      line-height: 1.75;
      word-break: keep-all;
    }

    @media (max-width: 720px) {
      .philosophy-banner {
        padding-block: 34px;
      }

      .philosophy-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }

      .philosophy-card--quality {
        grid-row: auto;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html#home" aria-label="WaBuk 홈">
        <img src="wabuk-logo.png" alt="WaBuk">
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false"
              aria-controls="main-nav" hidden>
        메뉴
      </button>

      <nav class="site-nav" id="main-nav" aria-label="주 메뉴">
        <a href="menu.html">메뉴</a>
        <a href="brand.html">브랜드</a>
        <a href="philosophy.html" aria-current="page">철학</a>
        <a href="news.html">소식</a>
        <a href="store.html">매장</a>
      </nav>
    </div>
  </header>

  <main class="philosophy-page">
    <div class="philosophy-banner">
      <div class="container">
        <h1>와벅의 철학</h1>
        <p>좋은 음식으로 일상에 작은 행복을.</p>
      </div>
    </div>

    <section class="philosophy-values" aria-labelledby="values-title">
      <div class="container">
        <h2 id="values-title">와벅이 지키는 기준</h2>

        <div class="philosophy-grid">
          <article class="philosophy-card philosophy-card--quality">
            <h3>품질을 먼저 생각합니다</h3>
            <p>
              맛과 안전, 서비스에 세운 기준을 지켜 손님이 믿고 다시
              찾을 수 있는 한 끼를 준비합니다.
            </p>
          </article>

          <article class="philosophy-card">
            <h3>사람을 존중합니다</h3>
            <p>
              일의 기준은 명확하게 세우고, 함께 일하는 사람의
              의견과 상황을 존중합니다.
            </p>
          </article>

          <article class="philosophy-card">
            <h3>함께 성장합니다</h3>
            <p>
              함께 일하는 사람과 매장이 각자의 자리에서
              성장할 수 있는 관계를 지향합니다.
            </p>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© 2026 WaBuk. All rights reserved.</small>
    </div>
  </footer>
</body>
</html>
