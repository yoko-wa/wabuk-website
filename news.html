<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>와벅 소식 | WaBuk</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html#home" aria-label="WaBuk 홈">
        <img src="wabuk-logo.png" alt="WaBuk">
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false"
              aria-controls="main-nav" hidden>메뉴</button>
      <nav class="site-nav" id="main-nav" aria-label="주 메뉴">
        <a href="index.html#menu">메뉴</a>
        <a href="index.html#brand">브랜드</a>
        <a href="philosophy.html">철학</a>
        <a href="news.html" aria-current="page">소식</a>
        <a href="store.html">매장</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-heading">
      <div class="container">
        <h1>와벅 소식</h1>
        <p>첫 매장 준비와 메뉴 개발 이야기를 전합니다.</p>
      </div>
    </section>

    <section class="section" aria-label="소식 목록">
      <div class="container card-grid">
        <article class="card">
          <img src="wabuk-store-sign.png" alt="와벅 매장 외관 콘셉트">
          <div class="card-body">
            <h2>와벅의 시작</h2>
            <p>와벅의 첫 번째 매장을 준비하고 있습니다.</p>
            <a class="button" href="store.html">매장 안내 보기</a>
          </div>
        </article>

        <article class="card">
          <img src="wabuk-news-menu.png" alt="와벅 버거 메뉴 이미지">
          <div class="card-body">
            <h2>메뉴 이야기</h2>
            <p>와벅만의 맛을 만들어가고 있습니다.</p>
            <a class="button" href="index.html#menu">메뉴 보기</a>
          </div>
        </article>

        <article class="card">
          <img src="wabuk-brand-story.png" alt="와벅 브랜드 이미지">
          <div class="card-body">
            <h2>와벅이 추구하는 가치</h2>
            <p>맛있는 한 끼가 평범한 하루에 작은 기쁨이 되기를 바랍니다.</p>
            <a class="button" href="philosophy.html">브랜드 철학 보기</a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><small>© 2026 WaBuk. All rights reserved.</small></div>
  </footer>
</body>
</html>
