<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="와벅이 개발 중인 버거 메뉴 콘셉트를 소개합니다.">
  <title>와벅 메뉴 | WaBuk</title>
  <link rel="icon" href="assets/w-symbol.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js" defer></script>

  <link rel="stylesheet" href="css/menu.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html#home" aria-label="WaBuk 홈">
        <img src="assets/wordmark.png" alt="WaBuk">
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false"
              aria-controls="main-nav" hidden>
        메뉴
      </button>

      <nav class="site-nav" id="main-nav" aria-label="주 메뉴">
        <a href="index.html#home" data-page="index.html">HOME</a>
        <a href="index.html#menu" data-page="menu.html" aria-current="page">MENU</a>
        <a href="index.html#brand" data-page="brand.html">BRAND</a>
        <a href="index.html#philosophy" data-page="philosophy.html">PHILOSOPHY</a>
        <a href="index.html#news" data-page="news.html">NEWS</a>
        <a href="index.html#store" data-page="store.html">STORE</a>
      </nav>
    </div>
  </header>

  <main class="menu-page">
    <div class="menu-banner">
      <div class="container">
        <p class="page-label">MENU</p>
        <h1>와벅 메뉴</h1>
        <p>개발 중인 메뉴 콘셉트입니다. 구성은 출시 전 변경될 수 있습니다.</p>
      </div>
    </div>

    <section class="burger-section" id="menu" aria-labelledby="burger-title">
      <div class="container">
        <h2 id="burger-title">버거</h2>

        <div class="burger-grid">
          <article class="burger-card burger-card--featured">
            <img class="burger-photo" src="assets/bacon-jam-burger.webp"
                 alt="베이컨잼 벅" fetchpriority="high">
            <div class="burger-copy">
              <h3>베이컨잼 벅</h3>
              <p>달콤짭짤한 베이컨잼에 구운 양파를 더한 버거.</p>
            </div>
          </article>

          <article class="burger-card">
            <img class="burger-photo" src="assets/classic-burger.webp"
                 alt="클래식 버거">
            <div class="burger-copy">
              <h3>클래식 버거</h3>
              <p>와벅의 기본에 충실한 버거.</p>
            </div>
          </article>

          <article class="burger-card">
            <img class="burger-photo" src="assets/cajun-chicken-burger.webp"
                 alt="케이준 치킨 벅">
            <div class="burger-copy">
              <h3>케이준 치킨 벅</h3>
              <p>바삭한 케이준 치킨에 양배추·당근 샐러드와 피클을 더한 버거.</p>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© 2026 WaBuk. All rights reserved.</small>
    </div>
  </footer>
</body>
</html>
