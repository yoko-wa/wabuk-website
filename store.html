<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="와벅의 첫 매장 준비 소식과 매장 외관 콘셉트를 확인하세요.">
  <title>매장 안내 | WaBuk</title>
  <link rel="icon" href="assets/w-symbol.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js" defer></script>

  <link rel="stylesheet" href="css/store.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html#home" aria-label="WaBuk 홈">
        <img src="assets/wordmark.png" alt="WaBuk">
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false"
              aria-controls="main-nav" hidden>
        메뉴
      </button>

      <nav class="site-nav" id="main-nav" aria-label="주 메뉴">
        <a href="index.html#home" data-page="index.html">HOME</a>
        <a href="index.html#menu" data-page="menu.html">MENU</a>
        <a href="index.html#brand" data-page="brand.html">BRAND</a>
        <a href="index.html#philosophy" data-page="philosophy.html">PHILOSOPHY</a>
        <a href="index.html#news" data-page="news.html">NEWS</a>
        <a href="index.html#store" data-page="store.html" aria-current="page">STORE</a>
      </nav>
    </div>
  </header>

  <main class="store-page">
    <div class="store-banner">
      <div class="container">
        <p class="page-label">STORE</p>
        <h1>매장 안내</h1>
      </div>
    </div>

    <section class="store-content" aria-labelledby="first-store-title">
      <div class="container">
        <div class="store-panel">
          <div class="store-details">
            <span class="store-status">오픈 준비 중</span>
            <h2 id="first-store-title">와벅 첫 번째 매장</h2>
            <p>매장 위치와 오픈 일정은 확정되는 대로 안내하겠습니다.</p>
            <a class="button" href="news.html">와벅 소식 보기</a>
          </div>

          <figure class="store-figure">
            <img src="assets/store.webp"
                 alt="와벅 간판이 달린 통유리 매장 전면">
            <figcaption>매장 외관 콘셉트 이미지</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© 2026 WaBuk. All rights reserved.</small>
    </div>
  </footer>
